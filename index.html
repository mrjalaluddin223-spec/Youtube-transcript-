<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transcript — pull the full text from any YouTube video</title>
<meta name="description" content="Paste a YouTube link and get the full transcript, in the original language or any language YouTube offers, with timestamps." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161A;
    --panel:#1B2126;
    --panel-2:#20262C;
    --line:#2A3138;
    --text:#ECE8DF;
    --text-muted:#8D96A0;
    --amber:#F2B84B;
    --amber-dim:#C99A3E;
    --sage:#6FA88F;
    --danger:#E58A72;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--amber);}

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important; scroll-behavior:auto !important;}
  }

  .sprockets{
    height:18px;
    background-color:var(--panel);
    background-image:radial-gradient(circle, var(--bg) 0 4px, transparent 4.5px);
    background-size:24px 18px;
    background-position:center;
    background-repeat:repeat-x;
  }

  header.hero{
    background:linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
  }
  .hero-inner{
    max-width:780px;
    margin:0 auto;
    padding:64px 24px 56px;
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--amber);
    margin:0 0 18px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 56px);
    line-height:1.06;
    letter-spacing:-0.01em;
    margin:0 0 18px;
  }
  .sub{
    color:var(--text-muted);
    font-size:16px;
    line-height:1.55;
    max-width:520px;
    margin:0 auto 34px;
  }

  .input-row{
    display:flex;
    gap:10px;
    max-width:560px;
    margin:0 auto;
  }
  #url-input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:15px;
    font-family:'IBM Plex Mono',monospace;
  }
  #url-input::placeholder{color:var(--text-muted);}
  #url-input:focus{border-color:var(--amber);}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    border:none;
    cursor:pointer;
  }

  #fetch-btn{
    background:var(--amber);
    color:#1A1406;
    border-radius:var(--radius);
    padding:14px 22px;
    font-size:15px;
    white-space:nowrap;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  #fetch-btn:hover{background:#F5C767;}
  #fetch-btn:active{transform:translateY(1px);}

  .error-msg{
    color:var(--danger);
    font-size:14px;
    margin:16px auto 0;
    max-width:520px;
    font-family:'IBM Plex Mono',monospace;
  }

  @media (max-width:520px){
    .input-row{flex-direction:column;}
  }

  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:60px 20px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  .spinner{
    width:28px;height:28px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--amber);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  main#result{
    max-width:780px;
    margin:0 auto;
    padding:40px 24px 100px;
  }

  .video-meta{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:flex-start;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  #thumb{
    width:160px;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:8px;
    background:var(--panel);
    flex-shrink:0;
  }
  .video-meta > div:nth-child(2){flex:1; min-width:200px;}
  #video-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 12px;
    line-height:1.3;
  }
  .lang-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lang-row label{
    font-size:13px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;
  }
  #lang-select{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 10px;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }

  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    width:100%;
  }
  .actions button{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 14px;
    font-size:13px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .actions button:hover{border-color:var(--amber); color:var(--amber);}

  .transcript-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px;
    max-height:640px;
    overflow-y:auto;
  }
  .cue{
    display:flex;
    gap:16px;
    padding:11px 14px;
    border-radius:6px;
  }
  .cue:hover{background:var(--panel-2);}
  .cue-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--amber-dim);
    flex-shrink:0;
    width:56px;
    padding-top:1px;
  }
  .cue-text{
    font-size:14.5px;
    line-height:1.6;
    color:var(--text);
  }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    padding:0 20px 50px;
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="sprockets" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow">Transcript extractor</p>
      <h1>Paste a link.<br>Get every word.</h1>
      <p class="sub">Drop in any YouTube URL and pull the full transcript — original captions, any language YouTube offers, timestamps included.</p>
      <form id="transcript-form" class="input-row">
        <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." required />
        <button type="submit" id="fetch-btn">Get transcript</button>
      </form>
      <p id="error-msg" class="error-msg" hidden></p>
    </div>
    <div class="sprockets" aria-hidden="true"></div>
  </header>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <p>Reading captions…</p>
  </div>

  <main id="result" hidden>
    <section class="video-meta">
      <img id="thumb" src="" alt="" />
      <div>
        <h2 id="video-title"></h2>
        <div class="lang-row">
          <label for="lang-select">Language</label>
          <select id="lang-select"></select>
        </div>
      </div>
      <div class="actions">
        <button id="copy-btn" type="button">Copy text</button>
        <button id="download-txt" type="button">Download .txt</button>
        <button id="download-srt" type="button">Download .srt</button>
      </div>
    </section>

    <section class="transcript-panel" id="transcript-list"></section>
  </main>

  <footer>
    <p>Works with any public video that has captions — manual or auto-generated.</p>
  </footer>

<script>
  const form = document.getElementById('transcript-form');
  const urlInput = document.getElementById('url-input');
  const errorMsg = document.getElementById('error-msg');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const langSelect = document.getElementById('lang-select');
  let currentData = null;

  function extractVideoId(raw){
    const value = (raw || '').trim();
    try{
      const u = new URL(value);
      const host = u.hostname.replace(/^www\./,'');
      if(host === 'youtu.be'){
        return u.pathname.slice(1).split('/')[0] || null;
      }
      if(host.endsWith('youtube.com')){
        if(u.pathname === '/watch') return u.searchParams.get('v');
        if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
        if(u.pathname.startsWith('/live/')) return u.pathname.split('/')[2];
      }
      return null;
    }catch(e){
      if(/^[a-zA-Z0-9_-]{10,12}$/.test(value)) return value;
      return null;
    }
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function formatTime(sec){
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = Math.floor(sec%60);
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function srtTime(sec){
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = Math.floor(sec%60);
    const ms = Math.round((sec - Math.floor(sec)) * 1000);
    return `${pad(h)}:${pad(m)}:${pad(s)},${String(ms).padStart(3,'0')}`;
  }

  function showError(msg){ errorMsg.textContent = msg; errorMsg.hidden = false; }
  function hideError(){ errorMsg.hidden = true; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const videoId = extractVideoId(urlInput.value);
    if(!videoId){
      showError("That doesn't look like a YouTube link. Try pasting the full video URL.");
      return;
    }
    await loadTranscript(videoId);
  });

  langSelect.addEventListener('change', async () => {
    if(!currentData) return;
    await loadTranscript(currentData.videoId, langSelect.value);
  });

  async function loadTranscript(videoId, lang){
    hideError();
    result.hidden = true;
    loading.hidden = false;
    try{
      const params = new URLSearchParams({ videoId });
      if(lang) params.set('lang', lang);
      const res = await fetch(`/.netlify/functions/transcript?${params.toString()}`);
      const data = await res.json();
      if(!res.ok || data.error){
        throw new Error(data.message || 'Could not read that video.');
      }
      data.videoId = videoId;
      currentData = data;
      renderResult(data);
    }catch(err){
      showError(err.message || 'Something went wrong. Try again.');
    }finally{
      loading.hidden = true;
    }
  }

  function renderResult(data){
    document.getElementById('video-title').textContent = data.title || 'Untitled video';
    const thumb = document.getElementById('thumb');
    thumb.src = `https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg`;
    thumb.alt = data.title || '';

    langSelect.innerHTML = '';
    (data.languages || []).forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.code;
      opt.textContent = l.isAuto ? `${l.name} (auto)` : l.name;
      if(l.code === data.selectedLanguage) opt.selected = true;
      langSelect.appendChild(opt);
    });

    const list = document.getElementById('transcript-list');
    list.innerHTML = '';
    (data.transcript || []).forEach(cue => {
      const row = document.createElement('div');
      row.className = 'cue';
      const time = document.createElement('span');
      time.className = 'cue-time';
      time.textContent = formatTime(cue.start);
      const text = document.createElement('span');
      text.className = 'cue-text';
      text.textContent = cue.text;
      row.append(time, text);
      list.appendChild(row);
    });

    result.hidden = false;
  }

  function slugify(str){
    return (str || 'transcript').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60) || 'transcript';
  }

  function downloadFile(filename, content){
    const blob = new Blob([content], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function toSRT(cues){
    return cues.map((c,i) => {
      const start = srtTime(c.start);
      const end = srtTime(c.start + (c.duration || 2));
      return `${i+1}\n${start} --> ${end}\n${c.text}\n`;
    }).join('\n');
  }

  function flashButton(id, text){
    const btn = document.getElementById(id);
    const original = btn.textContent;
    btn.textContent = text;
    setTimeout(() => { btn.textContent = original; }, 1400);
  }

  document.getElementById('copy-btn').addEventListener('click', () => {
    if(!currentData) return;
    const text = currentData.transcript.map(c => c.text).join(' ');
    navigator.clipboard.writeText(text).then(() => flashButton('copy-btn', 'Copied'));
  });

  document.getElementById('download-txt').addEventListener('click', () => {
    if(!currentData) return;
    const text = currentData.transcript.map(c => c.text).join('\n');
    downloadFile(`${slugify(currentData.title)}.txt`, text);
  });

  document.getElementById('download-srt').addEventListener('click', () => {
    if(!currentData) return;
    downloadFile(`${slugify(currentData.title)}.srt`, toSRT(currentData.transcript));
  });
</script>
</body>
</html>
